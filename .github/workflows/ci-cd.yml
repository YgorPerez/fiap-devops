name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job de Build e Testes
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache dependências Maven
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Executar testes unitários
      run: mvn clean test

    - name: Gerar relatório de cobertura
      run: mvn jacoco:report

    - name: Upload relatório de cobertura
      uses: codecov/codecov-action@v3
      with:
        file: ./target/site/jacoco/jacoco.xml
        flags: unittests
        name: codecov-umbrella

    - name: Build da aplicação
      run: mvn clean package -DskipTests

    - name: Upload artefatos
      uses: actions/upload-artifact@v4
      with:
        name: java-app
        path: target/*.jar

  # Job de Análise de Código
  code-quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Executar análise com SpotBugs
      run: |
        mvn clean compile
        mvn spotbugs:check || true

    - name: Executar análise com PMD
      run: |
        mvn pmd:check || true

  # Job de Build da Imagem Docker
  build-docker:
    runs-on: ubuntu-latest
    needs: [build-and-test, code-quality]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login no GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extrair metadados
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build e push da imagem Docker
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Job de Deploy para Staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Deploy para Staging
      run: |
        echo "Deploying to staging environment..."
        # Aqui você pode adicionar comandos específicos para deploy
        # Por exemplo, usando kubectl, docker-compose, ou outros orquestradores

        # Exemplo com docker-compose
        # docker-compose -f docker-compose.yml -f docker-compose.staging.yml up -d

        # Exemplo com kubectl
        # kubectl apply -f k8s/staging/

        echo "Staging deployment completed!"

    - name: Executar testes de integração
      run: |
        echo "Running integration tests against staging..."
        # Aqui você pode executar testes de integração contra o ambiente de staging
        # curl -f http://staging.example.com/health || exit 1

    - name: Notificar deploy staging
      run: |
        echo "Staging deployment successful!"
        # Aqui você pode adicionar notificações (Slack, Teams, etc.)

  # Job de Deploy para Produção
  deploy-production:
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Deploy para Produção
      run: |
        echo "Deploying to production environment..."
        # Comandos específicos para deploy em produção

        # Exemplo com docker-compose
        # docker-compose -f docker-compose.yml -f docker-compose.production.yml up -d

        # Exemplo com kubectl
        # kubectl apply -f k8s/production/

        echo "Production deployment completed!"

    - name: Verificar saúde da aplicação
      run: |
        echo "Checking application health..."
        # Verificar se a aplicação está funcionando corretamente
        # curl -f http://production.example.com/health || exit 1

    - name: Notificar deploy produção
      run: |
        echo "Production deployment successful!"
        # Notificações para produção

  # Job de Rollback (manual)
  rollback:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: production

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Rollback
      run: |
        echo "Rolling back to previous version..."
        # Comandos para rollback
        # kubectl rollout undo deployment/fintech-app
        echo "Rollback completed!"

  # Job de Limpeza
  cleanup:
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()

    steps:
    - name: Limpeza de recursos
      run: |
        echo "Cleaning up resources..."
        # Limpeza de imagens antigas, logs, etc.
        echo "Cleanup completed!"
